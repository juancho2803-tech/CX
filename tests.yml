name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que no se suban datos reales de clientes
        run: |
          if git ls-files | grep -Ei '\.(csv|xlsx?)$' | grep -v '^data/ejemplo/'; then
            echo "::error::Hay archivos de datos fuera de data/ejemplo/. Los reportes reales contienen datos personales y no deben subirse."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests unitarios
        run: npm test

      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Prueba de humo en navegador
        run: npm run test:e2e
